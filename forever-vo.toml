# Respellings for names Chatterbox gets wrong. The model takes plain text only
# (no IPA or SSML), so the fix is spelling the word the way it should sound.
# Try candidates by ear first: of five for Gnomeregan (/noʊmɹəˈgɑːn/),
# "Nomer-gahn" was natural, "Gnome-ruh-gahn" was bad, and "Nome-ruh-GAHN" came
# out partly as numbers (so do not mark stress with capitals). Ahn'Qiraj is
# fine as written; "Ahn Kih-rahj" adds a rolled r. Quel'Thalas came out wrong;
# "Quell Thalas" and "Kwel-thalas" were both fine. Kharanos as written varies
# take to take, and so do "Karanos" and "Karra-noss" (each had bad takes out of
# four); "Karranos" was fine all four times, sometimes with a Scottish rolled r.
# Dun Morogh is fine as written. Tirisfal as written sometimes came out
# "Tirefal"; "Tirrisfal" and "Teerisfall" were right four times of four.
# Hyphens can leave a pause mid-word ("Teer-iss-fall"), so prefer respellings
# without them. Varimathras as written was only ever ok or good; "Vairimathrus"
# was good four times of four. Sharptalon reads best as two words: "Sharp
# Talon" beat the plain spelling and "Sharptallon" in the tauren-female voice,
# and a space does not leave the pause a hyphen can (#38).
[pronunciations]
"Ahn'Qiraj" = "Awnkeraj"
Gnomeregan = "Nomer-gahn"
Kharanos = "Karranos"
"Quel'Thalas" = "Quell Thalas"
Sharptalon = "Sharp Talon"
Tirisfal = "Tirrisfal"
Varimathras = "Vairimathrus"
Feralas = "fairalass"
Lordaeron = "Lorderon"
"Eldre'Thalas" = "Eldra thelass"
Tyrande = "teronda"
naxxramas = "naxRAMuss"
