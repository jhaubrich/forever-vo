[voices.notes]
# Tasting notes, one per voice, written in the audition page's voice card: what
# a voice sounds like by ear, which lines break it, what was tried and what to
# try next. For people; nothing generates from them.
dwarf-female = "Southern accent mostly eliminated by using barks for T3, but Scottish accent also gone. No combination of jokes or flirts can seem to land it. We can get close, but she drifts in and out of accents and it sounds worse than no accent at all."
nightelf-male = "sounds like malfurion."
scourge-male-warrior = "set 84 has very high quality barks"
troll-female-standard = "cannot get the accent right and out of ideas. It's actually better to not even try."
dwarf-male-grim = "can't get a scottish accent. gave up and used barks for best voice texture. Joke lines make the accent muddled and just terrible."
human-female-official = "can't get the right texture on this one. It's close enough."
troll-male-standard = "sadly, trolls made of barks alone minimized the accent drift"
orc-male-standard = "orcs are hard"
[tts]
# Chatterbox conditioning for every voice that has no entry below. tempo is not
# a model knob (Chatterbox has none): it is a pitch-preserving time stretch at
# encode time, 1.0 as generated, 1.1 ten percent faster. Chatterbox's own advice
# for pace is a lower cfg_weight, so try that before stretching.
exaggeration = 0.45
cfg_weight = 0.5
tempo = 1.0

# Dwarves came out of Chatterbox sounding American (#18). The reference clips
# are short NPC greetings, so the model keeps the timbre but drifts to its own
# neutral accent unless pushed, and pushing only works on a reference of a few
# long connected clips rather than the usual montage of barks. Tuning a voice
# restages exactly that voice's files (the settings join the text fingerprint),
# including the voices that borrow its clip.
#
# dwarf-male used to carry that fix here as `reference = "npc-3597"` (a named
# dwarf's four connected lines) at 0.75 / 0.3. It has no entry now: its clips
# are chosen by ear in [voices.sources.dwarf-male], which only takes effect
# with no `reference` pointing elsewhere, and it runs at the defaults. If the
# American accent comes back, the clips are the first thing to look at and the
# knobs the second: settings alone have never recovered an accent here, while
# a reference of connected speech rather than barks repeatedly has.
[tts.voices.dwarf-female]
exaggeration = 0.75
cfg_weight = 0.3

