# Forever Voiceover pipeline configuration. Read and validated by
# tools/config.py (load_config); an unknown key is an error. Everything here is
# something the owner edits by hand; constants nobody edits (paths, the client's
# race IDs) stay in tools/config.py.

[voices]
# Quests handed out by objects and items have no speaker to clone, so they are
# read by the narrator. That voice is a matter of taste, so every narrator line
# is also generated in the alternates and the player picks one in the addon's
# options. The narrator keeps the plain sound path (Sounds\Quests\<base>.mp3);
# the alternates live in Sounds\Quests\Narrator\<voice>\. Adding a voice here
# costs one more pass over every narrator line (~1,040 quest and ~336 gossip
# lines in the full Classic set, plus parts) and about 6.5% of every pack's
# size. The menu is one male and one female voice: the default (human-male's
# clip) and skyborne-female since 2026-10-01. Five alternates were a third of
# each pack until 2026-09-25, and the two base packs had to be split by quest
# level to stay under CurseForge's 1 GB cap; orc-male, the one kept then, was
# dropped for not sounding good enough. The dropped voices' files stay under
# Sounds/*/Narrator/ until deleted by hand; the tables and releases only list
# voices named here.
narrator = "narrator"
narrator_alternates = ["skyborne-female"]

# Sound folders (under sound/creature/ or sound/character/) that any voice may
# borrow clips from in the audition page's "Also offer clips from": characters this
# client ships recordings of but casts no NPC with. Gul'dan has 156 real Warlords and
# Legion lines here, connected speech that no orc set has; the night elf ones are
# for nightelf-male, whose 1.x emotes are thin (Legion's demon hunter player set, a
# Legion ghost, Jarod Shadowsong for the warrior archetype, and the nightborne
# player and citizen sets, who read from nightelf-male.wav; and Legion's weeping
# banshee, the one banshee speech this client ships: the WC3 banshee clip comes from
# the Reforged install, and banshee_sylvanas_no_loc is all empty files). `fvo-soundpaths
# --folders --only <folder>` lists a new one's real lines in
# tools/data/named_folders.json.
clip_folders = [
    "guldan",
    "pcdhnightelfmale",
    "night_elf_male_ghost",
    "commander_jarod_shadowsong",
    "pc_-_nightborne_elf_male",
    "nightborne_male_citizen",
    "weeping_banshee",
]

# Races without a reference clip borrow a related one; the narrator without a
# tools/voices/narrator.wav borrows human-male. A borrowed clip brings its
# owner's [tts.voices] tuning with it.
[voices.fallbacks]
narrator = "human-male"
felorc = "orc"
magharorc = "orc"
foresttroll = "troll"
icetroll = "troll"
zandalari = "troll"
skeleton = "scourge"
northrendskeleton = "scourge"
taunka = "tauren"
highmountaintauren = "tauren"
draenei = "human"
broken = "human"
vrykul = "human"
kultiran = "human"
thinhuman = "human"
worgen = "human"
naga = "nightelf"
nightborne = "nightelf"
voidelf = "bloodelf"
tuskarr = "dwarf"
darkirondwarf = "dwarf"
mechagnome = "gnome"
vulpera = "goblin"
pandaren = "human"
dracthyr = "bloodelf"

# When the client tables give no race for a speaker, the zone is a strong hint.
[voices.zone_hints]
"Zephras Isle" = "skyborne"

# A few model folders name a kind of creature the pack has no clip for, while a
# clip it does have is far closer than the adult human they would fall back to.
[voices.species_aliases]
orcmalekid = "humanmalekid-male"
orcfemalekid = "humanfemalekid-female"

# A named NPC (npc-<displayID>) is offered its greeting kit and every line in its
# sound set's folder under sound/creature/ as source clips. Some characters were
# filed under more than one folder over the expansions; list the others here, keyed
# by the set's own folder (tools/data/sound_sets.json), and run
# `./tools/run.sh fvo-soundpaths --folders` so tools/data/named_folders.json has them.
# Folders are never matched by name: anduin, anduin_lothar and anduinwrynn are two
# different people. lady_sylvanas_windrunner is Legion to Dragonflight.
[voices.named_folders]
# sylvanaswindrunner = ["sylvanas", "lady_sylvanas_windrunner"]
jainaproudmoore = ["lady_jaina_proudmoore"]  # Legion on
tyrandewhisperwind = ["tyrande_whisperwind"]  # Legion on
voljin = ["warchief_voljin"]  # Legion and Battle for Azeroth, long speeches

# One speaker always in one voice, ahead of everything the capture says
# (#319). Keyed like the pack's gossip (creature ID, negative for game
# objects); any voice name the generator resolves (race, archetype, species,
# npc-<displayID>). Changing an entry restages exactly that speaker's files.
# Per speaker, never per line, and for the cases the data cannot fix: pin from
# the audition page ("Always read ... in"), and generate.py warns about a
# voice with no clip of its own. Fizzlefuse (#352) is a goblin whose only
# model readings came out tauren and orc, read before 0.1.7 fixed the capture.
[voices.speakers]
"248200" = "goblin-male"

# NPCSounds set -> voice, for a creature whose display the client tables give no
# race and no species clip covers: the set Blizzard cast it with still says who it
# is. Only reached after the species step, so it never overrides a species clip.
# Set 66 is goblinMaleZany: Gryfe, Bragok, Kwee Q. Peddlefeet and Wizzlecrank's
# Shredder are goblins on models the tables give no race.
[voices.sound_sets]
"66" = "goblin-male-zany"

