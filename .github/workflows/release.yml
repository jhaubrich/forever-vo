name: Release addon

# Tag a commit (v0.2.0) to package ForeverVO with the BigWigs packager and
# publish it to GitHub Releases. Leave the CF_API_KEY secret UNSET: the
# repository is linked to CurseForge as a Source, so their own packager picks
# the tag up and uploads it. Setting the key here would upload the file twice.
# ForeverVO.toc carries ## X-Curse-Project-ID.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
        with:
          args: -g 1.60.1   # CurseForge lists Forever under game version "1.60.1"
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
