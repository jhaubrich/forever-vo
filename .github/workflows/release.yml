name: Release addon

# Tag a commit (v0.1.2) to package ForeverVO with the BigWigs packager and
# publish it to GitHub Releases and to CurseForge. The CF_API_KEY secret is
# set (since 2026-09-22): CurseForge's own source-linked packager never
# picked the tags up, so this workflow does the upload. ForeverVO.toc carries
# ## X-Curse-Project-ID, and the packager maps Interface 16001 to game
# version 1.60.1 on its own.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: BigWigsMods/packager@v2
        with:
          args: -g 1.60.1   # CurseForge lists Forever under game version "1.60.1"
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
