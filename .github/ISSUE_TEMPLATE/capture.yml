name: Contribute captured lines
description: Paste your /fvo export string. A bot decodes it, reacts with 🚀 and closes this issue.
title: "Captured lines"
labels: ["capture"]
body:
  - type: markdown
    attributes:
      value: |
        In game, type `/fvo export`, press Ctrl+C in the window that opens, and paste the string below. It starts with `FVO1:` and holds only quest and gossip text, the speaking NPC and the zone; your character name is removed before export. The capture keeps between logins and across your characters (since the late September 2026 beta update), so there is no need to export before every logout: once every few play sessions is plenty, and one export carries everything not yet voiced.
  - type: textarea
    id: export
    attributes:
      label: Export string
      description: The whole string, from FVO1 to the end. Line breaks from wrapping are fine.
      placeholder: "FVO1:eJy..."
    validations:
      required: true
  - type: input
    id: notes
    attributes:
      label: Anything else
      description: Optional. Where you played, or a line that came out wrong.
