name: Contribute captured lines
description: Paste your /fvo export string. A bot decodes it, reacts with 🚀 and closes this issue.
title: "Captured lines"
labels: ["capture"]
body:
  - type: markdown
    attributes:
      value: |
        **You do not have to do this for each quest.** One export packs up everything you have seen since your last export, across logins and characters, so once every few play sessions is plenty. A new issue per quest just sends the same lines again. A long export comes in parts (a link only holds about 25 lines), one issue each: send them all, or click All at Once in the game window to send it as one issue by pasting the export string below.

        In game, right-click the minimap button and choose "Send quests to project" (or type `/fvo export`), then use Copy Link. Pasting that link opens this form with the box below filled in. If the box is empty, the string was too long for the link: it is in the game window under Export string, and it pastes here. It starts with `FVO1:`.

        **What is sent:** the text, who said it, the zone, and your character's class, race and sex. Never your name.
  - type: textarea
    id: export
    attributes:
      label: Export string
      description: The whole string, from FVO1 to the end. Line breaks from wrapping are fine.
      placeholder: "FVO1:eJy..."
    validations:
      required: true
  - type: input
    id: notes
    attributes:
      label: Anything else
      description: Optional. Where you played, or a line that came out wrong.
