[release]
# Every pack uploads through CurseForge's API, which refused 574 and 887 MB and
# took 397, so each stays near 400 MB. Classic's set is fixed (about 1.1 GB with
# one alternate narrator in October 2026) and ships as three packs: quests to
# base_split_level (~345 MB), quests above it (~400 MB) and gossip (~375 MB).
# Forever's own quests and gossip ship as two more, which grow with play.
base_split_level = 40
# Release mp3s are mono at 22.05 kHz with no Xing/Info header frame (the
# client misreads that frame and stops the line early; see release_pack.py);
# 48k until 2026-09-22, when the base pack came to 1.3 GB with a third of the
# lines still to go. The working files under ForeverVO_Data/Sounds keep the
# generator's full quality, so this can go back up on any later build.
bitrate = "32k"
transcode_workers = 4

# CurseForge project IDs. The player addon's ID also lives in its TOC. The API
# key stays out of git (.env: CF_API_KEY, or CURSEFORGE_API_KEY).
[release.curseforge_projects]
addon = 1705010            # Forever Voiceover
classic_quests = 1705100   # Forever Voiceover: Classic Quests (Base until 2026-10-06)
classic_endgame = 1709884  # Forever Voiceover: Classic Endgame (Base Endgame until then)
classic_gossip = 1729567   # Forever Voiceover: Classic Gossip
forever_quests = 1705094   # Forever Voiceover: Forever Quests (the delta, Data: Forever, until then)
forever_gossip = 1729570   # Forever Voiceover: Forever Gossip
books = 1729514            # Forever Voiceover: Books
