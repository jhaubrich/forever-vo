<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#3b2a1a"/>
      <stop offset="100%" stop-color="#160f08"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3d27a"/>
      <stop offset="100%" stop-color="#b8862b"/>
    </linearGradient>
    <linearGradient id="parch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1e3c2"/>
      <stop offset="100%" stop-color="#d9c398"/>
    </linearGradient>
  </defs>

  <!-- round badge -->
  <circle cx="256" cy="256" r="248" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#gold)" stroke-width="10"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#6b4a1e" stroke-width="3"/>

  <!-- speech bubble -->
  <path d="M132 150
           h200 a34 34 0 0 1 34 34
           v112 a34 34 0 0 1 -34 34
           h-96 l-62 54 v-54 h-42 a34 34 0 0 1 -34 -34
           v-112 a34 34 0 0 1 34 -34 z"
        fill="url(#parch)" stroke="#6b4a1e" stroke-width="8" stroke-linejoin="round"/>

  <!-- text lines inside the bubble -->
  <rect x="164" y="192" width="156" height="14" rx="7" fill="#6b4a1e" opacity="0.85"/>
  <rect x="164" y="226" width="118" height="14" rx="7" fill="#6b4a1e" opacity="0.85"/>
  <rect x="164" y="260" width="140" height="14" rx="7" fill="#6b4a1e" opacity="0.85"/>

  <!-- sound waves -->
  <g fill="none" stroke="url(#gold)" stroke-width="16" stroke-linecap="round">
    <path d="M388 196 a70 70 0 0 1 0 100"/>
    <path d="M414 168 a110 110 0 0 1 0 156"/>
  </g>
</svg>
